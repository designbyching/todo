<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>M&m To-Do List</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>M&m To-Do List</h1>
      <div class="board">
        <!-- To Do Column -->
        <div class="column" id="todo">
          <h2>To Do</h2>
          <div class="add-task">
            <input type="text" id="todo-input" placeholder="Add a task..." />
            <button onclick="addTask('todo')">Add</button>
          </div>
          <div class="task-list"></div>
        </div>
        <!-- In Progress Column -->
        <div class="column" id="in-progress">
          <h2>In Progress</h2>
          <div class="add-task">
            <input
              type="text"
              id="in-progress-input"
              placeholder="Add a task..."
            />
            <button onclick="addTask('in-progress')">Add</button>
          </div>
          <div class="task-list"></div>
        </div>
        <!-- Done Column -->
        <div class="column" id="done">
          <h2>Done</h2>
          <div class="add-task">
            <input type="text" id="done-input" placeholder="Add a task..." />
            <button onclick="addTask('done')">Add</button>
          </div>
          <div class="task-list"></div>
        </div>
      </div>
    </div>
    <!-- Load Interact.js from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
