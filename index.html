<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>M&m To-Do List</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>M&m To-Do List</h1>
      <div class="board">
        <!-- To Do Column -->
        <div class="column" id="todo">
          <h2>To Do</h2>
          <div class="add-task">
            <input type="text" id="todo-input" placeholder="Add a task..." />
            <button onclick="addTask('todo')">Add</button>
          </div>
          <div class="task-list"></div>
        </div>
        <!-- In Progress Column -->
        <div class="column" id="in-progress">
          <h2>In Progress</h2>
          <div class="add-task">
            <input
              type="text"
              id="in-progress-input"
              placeholder="Add a task..."
            />
            <button onclick="addTask('in-progress')">Add</button>
          </div>
          <div class="task-list"></div>
        </div>
        <!-- Done Column -->
        <div class="column" id="done">
          <h2>Done</h2>
          <div class="add-task">
            <input type="text" id="done-input" placeholder="Add a task..." />
            <button onclick="addTask('done')">Add</button>
          </div>
          <div class="task-list"></div>
        </div>
      </div>
      <!-- Slideshow -->
      <div class="slideshow-container">
        <div class="slide">
          <img
            src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?ixlib=rb-4.0.3&auto=format&fit=crop&w=1350&q=80"
            alt="Beach"
          />
        </div>
        <div class="slide">
          <img
            src="https://images.unsplash.com/photo-1448375240586-882707db888b?ixlib=rb-4.0.3&auto=format&fit=crop&w=1350&q=80"
            alt="Forest"
          />
        </div>
        <div class="slide">
          <img
            src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?ixlib=rb-4.0.3&auto=format&fit=crop&w=1350&q=80"
            alt="Mountains"
          />
        </div>
        <div class="slide">
          <img
            src="https://images.unsplash.com/photo-1519681393784-d120267933ba?ixlib=rb-4.0.3&auto=format&fit=crop&w=1350&q=80"
            alt="Snowy Peaks"
          />
        </div>
        <div class="slide">
          <img
            src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?ixlib=rb-4.0.3&auto=format&fit=crop&w=1350&q=80"
            alt="River"
          />
        </div>
        <div class="slide">
          <img
            src="https://images.unsplash.com/photo-1469474968028-566ce2e7e42e?ixlib=rb-4.0.3&auto=format&fit=crop&w=1350&q=80"
            alt="Desert"
          />
        </div>
        <!-- Navigation Buttons -->
        <button class="prev" onclick="changeSlide(-1)">❮</button>
        <button class="next" onclick="changeSlide(1)">❯</button>
      </div>
    </div>
    <!-- Load Interact.js from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
